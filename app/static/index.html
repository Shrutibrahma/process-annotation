}

/* ------------------------------------------------------------ line balancing */
const lineCache = new Map();
async function showLine() {
  view.innerHTML = `<div class="status">${SPARK}<p class="muted">Loading stations…</p></div>`;
  let rows;
  try { rows = (await (await api("/api/studies")).json()).filter(r => r.status === "ready"); }
  catch (e) { view.innerHTML = `<div class="status"><p class="err">${esc(e.message)}</p></div>`; return; }
  const saved = store.get("kc.line", {ids: [], takt: "", basis: "rep"});
  const ids = saved.ids.filter(id => rows.some(r => r.id === id));
  const state = {ids, takt: saved.takt, basis: saved.basis || "rep"};
  const persist = () => store.set("kc.line", state);
  const nameOf = id => { const r = rows.find(x => x.id === id); const h = r?.header || {}; return h.line || h.job || h.project || `Study #${r?.number}`; };
  const draw = async () => {
    persist();
    for (const id of state.ids) if (!lineCache.has(id)) {
      try { lineCache.set(id, await (await api(`/api/studies/${id}`)).json()); } catch { state.ids = state.ids.filter(x => x !== id); }
    }
    const takt = parseFloat(String(state.takt).replace(",", ".")) || null;
    const stations = state.ids.map(id => {
      const st = lineCache.get(id), ss = studyStats(st);
      const segs = state.basis === "rep"
        ? ss.repS.map((s, i) => ({v: s.end - s.start, c: COLOR[s.category], cat: s.category, tip: `${esc(nameOf(id))}<br>${i + 1}. ${esc(s.title)}<br>${f1(s.end - s.start)} s · ${CAT_SHORT[s.category]}`}))
        : ss.elements.filter(e => e.lr).map((e, i) => ({v: e.lr, c: COLOR[e.category], cat: e.category, tip: `${esc(nameOf(id))}<br>${i + 1}. ${esc(e.title)}<br>${e.lr} s (lowest repeatable) · ${CAT_SHORT[e.category]}`}));
      const total = segs.reduce((a, s) => a + s.v, 0);
      const byCat = Object.fromEntries(CATS.map(k => [k, segs.filter(s => s.cat === k).reduce((a, s) => a + s.v, 0)]));
      return {id, name: nameOf(id), segs, total, byCat};
    });
    const total = stations.reduce((a, s) => a + s.total, 0), maxS = stations.length ? Math.max(...stations.map(s => s.total)) : 0;
    const bott = stations.find(s => s.total === maxS);
    const eff = stations.length && maxS ? total / (stations.length * maxS) * 100 : 0;
    const body = document.getElementById("lineResult");
    if (!stations.length) { body.innerHTML = `<section class="card"><p class="muted" style="margin:0">Pick two or more ready studies, one per station, in line order.</p></section>`; return; }
    body.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="k">Stations</div><div class="v">${stations.length}</div><div class="d">Total work content ${f1(total)} s</div></div>
        <div class="kpi"><div class="k">Bottleneck</div><div class="v">${f1(maxS)}<small> s</small></div><div class="d">${esc(bott.name)}${takt ? ` · <span class="state ${maxS > takt ? "bad" : "good"}">${maxS > takt ? "▲ over takt" : "✓ within takt"}</span>` : ""}</div></div>
        <div class="kpi"><div class="k">Line balance efficiency</div><div class="v">${eff.toFixed(0)}<small> %</small></div><div class="d">Σ station time ÷ (stations × bottleneck)</div></div>
        <div class="kpi"><div class="k">Operators needed at takt</div><div class="v">${takt ? Math.ceil(total / takt) : "–"}</div><div class="d">${takt ? `Σ ${f1(total)} s ÷ takt ${takt} s = ${(total / takt).toFixed(2)}` : "Enter a takt time"}</div></div>
        <div class="kpi"><div class="k">Max output</div><div class="v">${maxS ? Math.floor(3600 / maxS) : "–"}<small> /hour</small></div><div class="d">Set by the bottleneck</div></div>
      </div>
      <section class="card chart">
        <div class="chart-head"><h2>Yamazumi</h2>${legend()}</div>
        ${barChart({items: stations.map(s => ({name: s.name, label: f1(s.total), hot: s === bott && stations.length > 1, segs: s.segs})), max: maxS, ref: takt, refLabel: takt ? `Takt ${takt} s` : ""})}
        <p class="muted" style="font-size:.8rem;margin:10px 0 0">Each block is one step; hover for details. Outlined bar = bottleneck.</p>
      </section>
      <section class="card"><h2>Stations</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Station</th>${CATS.map(k => `<th class="num">${CAT_SHORT[k]} (s)</th>`).join("")}<th class="num">Total (s)</th><th class="num">vs takt</th></tr></thead><tbody>
        ${stations.map(s => `<tr><td>${esc(s.name)}${s === bott && stations.length > 1 ? ' <span class="chip">Bottleneck</span>' : ""}</td>${CATS.map(k => `<td class="num">${f1(s.byCat[k])}</td>`).join("")}<td class="num">${f1(s.total)}</td><td class="num">${takt ? (s.total > takt ? `<span class="state bad">+${f1(s.total - takt)}</span>` : `<span class="state good">−${f1(takt - s.total)}</span>`) : ""}</td></tr>`).join("")}
      </tbody></table></div></section>`;
    bindTips(body);
  };
  const renderPicker = () => {
    document.getElementById("order").innerHTML = state.ids.length ? state.ids.map((id, i) => `<div><span>${i + 1}. ${esc(nameOf(id))}</span>
      <button class="iconbtn" data-mv="${i}" data-d="-1" aria-label="Move up" ${i === 0 ? "disabled" : ""}>${ICON.up}</button>
      <button class="iconbtn" data-mv="${i}" data-d="1" aria-label="Move down" ${i === state.ids.length - 1 ? "disabled" : ""}>${ICON.down}</button>
      <button class="iconbtn" data-rmv="${i}" aria-label="Remove">${ICON.x}</button></div>`).join("") : `<span class="muted">No stations selected</span>`;
    document.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.d; [state.ids[i], state.ids[j]] = [state.ids[j], state.ids[i]]; renderPicker(); draw(); });
    document.querySelectorAll("[data-rmv]").forEach(b => b.onclick = () => { state.ids.splice(+b.dataset.rmv, 1); syncChecks(); renderPicker(); draw(); });
  };
  const syncChecks = () => document.querySelectorAll("[data-pick]").forEach(c => c.checked = state.ids.includes(c.dataset.pick));
  view.innerHTML = `
  <div class="study-top"><div class="title"><div class="eyebrow">Line</div><h1>Line balancing</h1><div class="sub">Each study is one station. Compare them against takt to find the bottleneck and rebalance.</div></div></div>
  <div class="stack">
    <section class="card" style="display:grid;grid-template-columns:1fr 1fr 260px;gap:18px">
      <div><h2 style="font-size:.95rem">Studies</h2>${rows.length ? `<div class="picker">${rows.map(r => `<label><input type="checkbox" data-pick="${r.id}" ${state.ids.includes(r.id) ? "checked" : ""}> #${r.number ?? "–"} ${esc(nameOf(r.id))}<span class="muted" style="font-size:.8rem">${esc(r.header.project || "")}</span></label>`).join("")}</div>` : `<p class="muted">No ready studies yet.</p>`}</div>
      <div><h2 style="font-size:.95rem">Line order</h2><div class="order" id="order"></div></div>
      <div style="display:grid;gap:12px;align-content:start">
        <label class="f">Takt time (s)<input type="text" id="takt" inputmode="decimal" value="${esc(state.takt)}" placeholder="e.g. 90"></label>
        <label class="f">Station time from<select id="basis"><option value="rep" ${state.basis === "rep" ? "selected" : ""}>Instruction cycle (as observed)</option><option value="lr" ${state.basis === "lr" ? "selected" : ""}>Σ lowest repeatable per element</option></select></label>
      </div>
    </section>
    <div class="stack" id="lineResult"></div>
  </div>`;
  document.querySelectorAll("[data-pick]").forEach(c => c.onchange = () => {
    if (c.checked) state.ids.push(c.dataset.pick); else state.ids = state.ids.filter(x => x !== c.dataset.pick);
    if (!state.takt) { const r = rows.find(x => x.id === c.dataset.pick); if (c.checked && r?.header.takt) { state.takt = r.header.takt; document.getElementById("takt").value = state.takt; } }
    renderPicker(); draw();
  });
  document.getElementById("takt").oninput = e => { state.takt = e.target.value; draw(); };
  document.getElementById("basis").onchange = e => { state.basis = e.target.value; draw(); };
  renderPicker(); draw();
}

async function save() {
  const btn = document.getElementById("save"); if (btn) btn.disabled = true;
  try {
    const body = {header: S.header, cycles: S.cycles, steps: S.steps, representative_cycle: S.representative_cycle};
    const fresh = await (await api(`/api/studies/${S.id}`, jsonBody("PUT", body))).json();

    return true;
  } catch (e) { if (btn) btn.disabled = false; toast(`Not saved: ${e.message}`); return false; }
}
async function download(url, busy) {
  if (dirty && !(await save())) return;
  toast(`${busy}…`);
  try {
    const r = await api(url), blob = await r.blob();
    const name = (r.headers.get("content-disposition") || "").match(/filename="?([^";]+)"?/)?.[1] || "export";
    const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: name});
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`Downloaded ${name}`);
  } catch (e) { toast(`Export failed: ${e.message}`); }
}

      renderAccount(); refreshSidebar(); route();
    } catch (e) { renderAuth(e.message); }
  };
}
function renderAccount() {
  const el = document.getElementById("acct");
  if (!ME || !ME.auth) { el.hidden = true; return; }
  const t = ME.team || {};
  el.hidden = false;
  el.innerHTML = `<div><b>${esc(ME.name)}</b> · ${esc(t.name || "")}</div>
    ${t.code ? `<div>Invite code <code>${esc(t.code)}</code> <button id="copyCode" title="Copy the invite code">copy</button></div>` : ""}
    <div>${t.analyses_this_month ?? 0} of ${t.monthly_limit ?? "–"} video analyses this month</div>
    <div><button id="signOut">Sign out</button></div>`;
  const cc = document.getElementById("copyCode");
  if (cc) cc.onclick = () => { navigator.clipboard?.writeText(`${location.origin}  ·  team invite code ${t.code}`); toast("Link and invite code copied"); };
  document.getElementById("signOut").onclick = async () => { try { await api("/api/auth/logout", {method: "POST"}); } catch {} ME = null; S = null; renderAuth(); };
}

(async () => {
  try { CFG = await (await api("/api/config")).json(); } catch {}
  if (CFG.auth) {
    const r = await fetch("/api/me");
    if (r.status === 401) { renderAuth(); return; }
    ME = await r.json(); renderAccount();
  }
  refreshSidebar(); route();
})();
</script>
</body>
</html>
