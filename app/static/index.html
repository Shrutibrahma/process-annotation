<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Annotation · Learn any task, step by step</title>
<link rel="icon" type="image/svg+xml" href="/brand/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ecece7; --surface:#fff; --surface-2:#f6f6f2; --line:#d6d6cd; --line-2:#e7e7e0;
  --ink:#1d1f1a; --ink-2:#3c3f37; --muted:#6b6a60;
  --primary:#487037; --primary-hover:#3a5c2c; --soft:#e2eadb; --on-soft:#22361a;
  --accent:#9db384; --warm:#847f72; --side:#262823; --side-ink:#dcdcd2; --side-muted:#9c998c; --side-hover:rgba(255,255,255,.06); --side-sel:#3a4433;
  --va:#1baf7a; --nnva:#2a78d6; --waste:#eb6834; --err:#b3261e;
  --r:10px; --r-sm:8px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --spark:linear-gradient(90deg,#0d6b5c 0%,#0d6b5c 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--font);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}
.muted{color:var(--muted)} .err{color:var(--err)}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;background:var(--side) url(/brand/camo-dark.svg) repeat;color:var(--side-ink);border-right:3px solid var(--primary)}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 16px;text-decoration:none;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand .mark{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,#f4f4ef,#dcddd3);box-shadow:0 1px 0 #fff inset,0 6px 14px -6px rgba(0,0,0,.6)}
.brand .mark img{width:26px;height:auto}
.brand b{display:block;font-size:1.15rem;font-weight:800;letter-spacing:.06em;line-height:1.05;color:#fff}
.brand .ls{display:block;font-size:.62rem;font-weight:700;letter-spacing:.2em;color:var(--warm);margin-top:2px}
.brand small{display:block;color:var(--accent);font-size:.7rem;margin-top:5px;letter-spacing:.01em}
.spark{width:26px;height:26px;flex:none}
.new-btn{display:flex;align-items:center;gap:10px;border:0;background:var(--primary);color:#fff;padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:600;text-decoration:none;width:max-content;margin:0 0 10px 4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.new-btn:hover{background:var(--primary-hover)}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current=page]{background:var(--side-sel);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:20px;height:20px}
.side h3{font-size:.7rem;font-weight:600;color:var(--side-muted);margin:16px 12px 4px;text-transform:uppercase;letter-spacing:.08em}
.recent a{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent a:hover{background:var(--side-hover)}
.recent a[aria-current=page]{background:var(--side-sel);color:#fff}
.recent .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#9aa0a6}
.dot.ready{background:var(--va)} .dot.processing{background:var(--primary);animation:pulse 1.2s infinite} .dot.failed{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}
.side .foot{margin-top:auto;padding:10px 12px;font-size:.72rem;color:var(--side-muted)}
.side .muted{color:var(--side-muted)}
.main{min-width:0;padding:14px 20px 28px}
.menu{display:none;border:0;background:transparent;padding:8px;border-radius:50%;cursor:pointer}
.menu svg{width:22px;height:22px}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:#c5cfdc}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.tonal{background:var(--soft);border-color:var(--soft);color:var(--on-soft)}
.btn.tonal:hover{background:#c5e5dc}
.btn.text{border-color:transparent;background:transparent}
.btn svg{width:18px;height:18px}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:rgba(68,71,70,.08)}
.iconbtn svg{width:22px;height:22px}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;width:100%}
textarea{resize:vertical;min-height:64px}
.card{background:var(--surface);border-radius:var(--r);padding:22px;border:1px solid var(--line-2);box-shadow:0 1px 2px rgba(16,35,30,.04)}
.card h2{font-size:1.05rem;font-weight:600;margin:0 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;background:var(--line-2);color:var(--ink-2);font-weight:500}
.chip .sw{width:8px;height:8px;border-radius:50%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#303030;color:#f2f2f2;padding:10px 18px;border-radius:12px;font-size:.9rem;z-index:20;max-width:90vw}
.status{max-width:560px;margin:90px auto;text-align:center}
.status .spark{width:44px;height:44px;animation:pulse 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* home */
.home{max-width:900px;margin:0 auto;padding:36px 0 0}
.hello{font-size:2.1rem;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0;color:var(--ink);max-width:100%}
.hello-sub{font-size:1.15rem;line-height:1.4;color:var(--muted);font-weight:400;margin:6px 0 24px}
.composer{background:var(--surface);border-radius:12px;padding:16px 16px 12px;border:1px solid var(--line-2);box-shadow:0 2px 8px rgba(16,35,30,.05)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;cursor:pointer;color:var(--ink-2)}
.drop.over{border-color:var(--primary);background:#eef7f4}
.drop b{font-weight:500;font-size:1.02rem}
.comp-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.comp-row .grow{flex:1}
.go{width:48px;height:48px;border-radius:10px;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer}
.go:disabled{background:#e3e3e3;color:#a0a0a0;cursor:default}
.go svg{width:22px;height:22px}
details.meta{margin-top:10px;border-top:1px solid var(--line-2);padding-top:8px}
details.meta summary{cursor:pointer;color:var(--ink-2);font-weight:500;padding:4px 2px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.rec-prev{width:100%;max-height:340px;border-radius:16px;background:#000;margin-top:10px}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--err);margin-right:6px;animation:pulse 1s steps(2) infinite}
progress{width:100%;height:6px;accent-color:var(--primary)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.feat{background:var(--surface);border-radius:10px;padding:16px;text-decoration:none;color:var(--ink);border:1px solid transparent}
a.feat:hover{background:#fff;border-color:var(--line)}
.feat b{display:block;font-weight:500;margin:8px 0 2px}
.feat span{color:var(--muted);font-size:.86rem}
.feat .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--on-soft)}
.feat .ic svg{width:20px;height:20px}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2)}
table.list th{font-weight:500;color:var(--muted);font-size:.8rem}
table.list a{text-decoration:none;font-weight:500}

/* study */
.study-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 14px}
.study-top .title{flex:1;min-width:240px}
.eyebrow{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.study-top h1{font-size:1.45rem;font-weight:700;margin:2px 0 0;letter-spacing:-.01em}
.study-top .sub{color:var(--muted);font-size:.88rem}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0;border-radius:0}
.tabs a{padding:9px 14px;border-radius:0;text-decoration:none;color:var(--ink-2);font-weight:500;display:flex;gap:6px;align-items:center;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{background:transparent;color:var(--ink)}
.tabs a[aria-selected=true]{background:transparent;color:var(--primary);border-bottom-color:var(--primary)}
.tabs svg{width:16px;height:16px}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap;width:100%;justify-content:flex-end}

/* instructions */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:14px;height:calc(100vh - 178px);min-height:540px}
.pane{background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.steps-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;font-weight:500}
.cycle-pick{padding:0 14px 10px}
.steps{list-style:none;margin:0;padding:0 10px 10px;overflow:auto;flex:1}
.step{padding:10px 14px;margin-bottom:4px;border-radius:16px;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:2px 8px}
.step:hover{background:var(--surface-2)}
.step[aria-selected=true]{background:var(--soft);color:var(--on-soft)}
.step .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem;padding-top:1px}
.step .st-title{font-weight:500;line-height:1.35}
.step .st-meta{grid-column:2;font-size:.8rem;color:var(--muted);display:flex;gap:10px;align-items:center}
.step[aria-selected=true] .st-meta,.step[aria-selected=true] .n{color:#3c4a66}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.sw.value_add{background:var(--va)} .sw.necessary_nva{background:var(--nnva)} .sw.waste{background:var(--waste)}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.step-no{font-size:.8rem;color:var(--muted);font-weight:500}
.center h2{margin:0 0 10px;font-size:1.25rem;font-weight:500;line-height:1.3}
.player{background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
video{width:100%;flex:1;min-height:0;background:#000;object-fit:contain;display:block}
.ctrl{padding:6px 14px 10px}
.ctrl-row{display:flex;align-items:center;gap:6px;font-size:.85rem;font-variant-numeric:tabular-nums}
.ctrl-row .grow{flex:1}
.icon{border:0;background:transparent;padding:6px;cursor:pointer;display:inline-flex;border-radius:50%;color:var(--ink-2)}
.icon:hover{background:rgba(68,71,70,.08)}
.icon svg{width:20px;height:20px}
.icon[aria-pressed=true]{color:var(--primary)} .icon[aria-pressed=false]{color:#9aa0a6}
.play{background:var(--primary);color:#fff;width:40px;height:40px;justify-content:center;align-items:center}
.play:hover{background:var(--primary-hover)}
.speed{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.speed select{width:auto;padding:2px 6px;border-radius:8px}
input[type=range]{width:100%;accent-color:var(--primary);margin:6px 0 0}
.right{gap:12px;padding:14px;overflow:auto}
.cyc{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.cyc b{font-size:1.25rem;font-weight:500}
.sec{background:var(--surface-2);border-radius:16px;display:flex;flex-direction:column}
.sec-h{padding:12px 14px 0;font-weight:500;font-size:.9rem}
.sec-b{padding:6px 14px 14px;display:flex;flex-direction:column}
.sec-b ul{margin:0;padding-left:18px}
.empty{color:var(--muted);font-size:.88rem}
.edit-block{display:grid;gap:10px;background:var(--surface-2);border-radius:16px;padding:14px}
.edit-block h3{margin:0;font-size:.95rem;font-weight:500}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.88rem}
.edit-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.timeline{position:relative;height:30px;margin-top:10px;background:var(--surface);border-radius:10px;cursor:pointer;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;border-right:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:#fff}
.seg.value_add{background:var(--va)} .seg.necessary_nva{background:var(--nnva)} .seg.waste{background:var(--waste)}
.seg.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);pointer-events:none}
.tr{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tr li{display:grid;grid-template-columns:52px 1fr;gap:6px;padding:5px 8px;border-radius:10px;cursor:pointer;line-height:1.35}
.tr li:hover{background:#fff}
.tr li[aria-current=true]{background:var(--soft);color:var(--on-soft)}
.tr .ts{color:var(--muted);font-variant-numeric:tabular-nums}

/* dashboards */
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:10px;border:1px solid var(--line-2);padding:16px 18px}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.7rem;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:.9rem;color:var(--muted);font-weight:400}
.kpi .d{font-size:.8rem;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500}
.state.good{color:#146c2e} .state.bad{color:var(--err)}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.chart{position:relative}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{position:relative;display:flex;align-items:flex-end;gap:10px;height:220px;padding:0 4px 0 40px;border-bottom:1px solid var(--line)}
.bars .gl{position:absolute;left:40px;right:0;border-top:1px solid var(--line-2);font-size:.72rem;color:var(--muted)}
.bars .gl span{position:absolute;left:-40px;width:34px;text-align:right;transform:translateY(-50%)}
.bars .ref{position:absolute;left:40px;right:0;border-top:2px dashed var(--ink-2);z-index:2;pointer-events:none}
.bars .ref span{position:absolute;right:0;top:-20px;font-size:.75rem;color:var(--ink-2);background:rgba(255,255,255,.85);padding:0 4px;border-radius:4px}
.bar{flex:1;max-width:110px;display:flex;flex-direction:column-reverse;gap:2px;position:relative;z-index:1;cursor:default}
.bar .s{border-radius:0;min-height:2px}
.bar .s:last-child{border-radius:4px 4px 0 0}
.bar .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar.x .s{background:repeating-linear-gradient(45deg,#c4cad3 0 4px,#e3e7ec 4px 8px)!important}
.bar.hot{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.xl{display:flex;gap:10px;padding:6px 4px 0 40px;font-size:.75rem;color:var(--muted)}
.xl span{flex:1;max-width:110px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.hbar div{min-width:2px}
.split-rows{display:grid;gap:6px;font-size:.88rem}
.split-rows div{display:flex;justify-content:space-between;gap:10px}
.tip{position:fixed;pointer-events:none;background:#303030;color:#f2f2f2;padding:6px 10px;border-radius:8px;font-size:.8rem;z-index:30;max-width:280px}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:.78rem;background:var(--surface-2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .x{color:#9aa0a6;text-decoration:line-through}
.tbl .hi{color:var(--err);font-weight:600}
.tbl .lo{text-decoration:underline;font-weight:600}
.scroll-x{overflow-x:auto}

/* kaizen */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.idea{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fff}
.idea b{font-weight:500;font-size:1rem;line-height:1.3}
.idea p{margin:0;color:var(--ink-2);font-size:.88rem}
.idea .meta{display:flex;gap:6px;flex-wrap:wrap}
.idea .save{font-size:1.3rem;font-weight:500;color:var(--on-soft)}
.idea .btn{margin-top:auto;align-self:flex-start}
.act td input,.act td select{padding:5px 8px;border-radius:8px;font-size:.85rem}

/* copilot */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 178px);min-height:520px;background:var(--surface);border-radius:var(--r);overflow:hidden}
.msgs{flex:1;overflow:auto;padding:24px 24px 8px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:860px;width:100%;margin:0 auto;display:flex;gap:14px}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--line-2);border-radius:22px 22px 6px 22px;padding:10px 16px;max-width:70%;white-space:pre-wrap}
.msg.model .spark{width:28px;height:28px;margin-top:2px}
.msg.model .body{flex:1;min-width:0}
.md h1,.md h2,.md h3{font-weight:500;margin:14px 0 6px;line-height:1.3} .md h1{font-size:1.2rem} .md h2{font-size:1.08rem} .md h3{font-size:1rem}
.md p{margin:6px 0} .md ul,.md ol{margin:6px 0;padding-left:22px}
.md code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:.88em}
.md table{border-collapse:collapse;margin:8px 0;font-size:.86rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2);font-weight:500}
.msg-tools{display:flex;gap:4px;margin-top:4px}
.thinking{display:flex;gap:12px;align-items:center;color:var(--muted)}
.thinking .spark{animation:pulse 1.6s ease-in-out infinite}
.hello-chat{margin:auto;max-width:860px;width:100%;padding:10px 0}
.hello-chat .hello{font-size:2rem}
.sugg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.sugg button{border:0;background:var(--surface-2);border-radius:18px;padding:14px;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:4px}
.sugg button:hover{background:#e9eef6}
.sugg b{font-weight:500} .sugg span{color:var(--muted);font-size:.84rem}
.chatbar{padding:10px 24px 18px}
.chatbox{max-width:860px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface-2);border-radius:28px;padding:8px 8px 8px 20px;border:1px solid var(--line-2)}
.chatbox textarea{border:0;background:transparent;resize:none;min-height:24px;max-height:180px;padding:8px 0;outline:none}
.chatnote{max-width:860px;margin:6px auto 0;font-size:.75rem;color:var(--muted);text-align:center}

/* work chart + breakdown */
.chart-layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px;align-items:start}
.chart-img{background:#fff;border-radius:16px;overflow:auto;border:1px solid var(--line-2)}
.chart-img img{width:100%;display:block}
.loc-tbl td{padding:4px 4px}
#layoutEd{overflow:hidden}
#layoutEd svg{max-height:520px}
#locPanel{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
table.tpl-tbl{table-layout:fixed;min-width:900px}
table.tpl-tbl input[type=text],table.tpl-tbl select{width:100%;min-width:0}
table.tpl-tbl th,table.tpl-tbl td{overflow:hidden}
.loc-tbl input,.loc-tbl select{padding:4px 6px;border-radius:8px;font-size:.82rem}
.loc-tbl .lid{font-weight:600;color:var(--on-soft);white-space:nowrap}
.warnbox{background:#fff4e5;border:1px solid #f6d7a7;border-radius:14px;padding:10px 12px;font-size:.86rem;color:#7a4b00}
.okbox{background:#e6f4ea;border:1px solid #b7dfc3;border-radius:14px;padding:10px 12px;font-size:.86rem;color:#146c2e}
.bd-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.bd-tbl tr{cursor:pointer}
.bd-tbl tr.sel td{background:var(--soft)}
.bd-tbl td.tr-cell{white-space:pre-line;color:var(--ink-2);font-size:.82rem;min-width:260px}
.bd-tbl select{padding:4px 6px;border-radius:8px;font-size:.82rem;max-width:200px}
.sticky{position:sticky;top:14px}
.sticky video{border-radius:16px;max-height:300px}
@media (max-width:1180px){.chart-layout,.bd-layout{grid-template-columns:1fr}}

/* line balancing */
.picker{display:grid;gap:6px;max-height:260px;overflow:auto}
.picker label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer}
.picker label:hover{background:var(--surface-2)}
.order{display:grid;gap:6px}
.order div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 12px}
.order div span{flex:1}
.order .iconbtn{width:32px;height:32px}
.order .iconbtn svg{width:18px;height:18px}

@media (max-width:1180px){.layout{grid-template-columns:1fr;height:auto}.steps{max-height:340px}video{max-height:60vh}.row2{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;z-index:15;left:0;top:0;width:280px;background:var(--side);transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .menu{display:inline-grid}
  .grid4{grid-template-columns:1fr 1fr}.features,.sugg{grid-template-columns:1fr}
  .hello{font-size:2rem}.hello-sub{font-size:1.5rem}
  .main{padding:10px 14px 24px}
}
/* sign in */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);background:var(--bg)}
.auth-side{background:var(--side) url(/brand/camo-strong.svg) repeat;color:var(--side-ink);padding:48px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.auth-side .panel{background:rgba(30,32,27,.82);border-left:4px solid var(--primary);padding:24px 26px;border-radius:6px;display:grid;gap:14px;max-width:520px}
.auth-card .wm{height:46px;width:auto;justify-self:center;margin-bottom:4px}
.auth-side h1{color:#fff;font-size:2.2rem;line-height:1.15;margin:0;letter-spacing:-.02em}
.auth-side h1 i{font-style:normal;color:var(--accent)}
.auth-side h1{font-size:1.9rem}
.auth-side p{margin:0;color:var(--side-ink);max-width:460px}
.auth-side li{margin:6px 0;color:var(--side-ink)}
.auth-main{display:grid;place-items:center;padding:32px 18px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:26px;display:grid;gap:12px}
.auth-tabs{display:flex;border-bottom:1px solid var(--line)}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.auth-tabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary)}
.seg2{display:flex;gap:6px}
.seg2 label{flex:1;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.86rem}
.seg2 input{accent-color:var(--primary)}
.acct{border-top:1px solid rgba(255,255,255,.08);margin-top:8px;padding:10px 12px 0;font-size:.8rem;color:var(--side-ink);display:grid;gap:4px}
.acct b{color:#fff;font-weight:600}
.acct code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;color:var(--accent);font-size:.82rem}
.acct button{border:0;background:transparent;color:var(--side-muted);cursor:pointer;padding:0;text-align:left;font-size:.8rem}
.acct button:hover{color:#fff}
@media (max-width:900px){.auth-wrap{grid-template-columns:1fr}.auth-side{padding:28px 20px}}

/* teach (feedback) */
.teach-fab{position:fixed;right:22px;bottom:22px;z-index:12;display:flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;background:var(--side);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(16,35,30,.25)}
.teach-fab:hover{background:#1a3830}
.teach-fab svg{width:18px;height:18px;color:var(--accent)}
.teach-fab{background:var(--side) url(/brand/camo-dark.svg) repeat;border:1px solid #3a3d34}
.teach{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:16;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(16,35,30,.12);display:flex;flex-direction:column}
.teach header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.teach header b{flex:1;font-size:1rem}
.teach .tb{flex:1;overflow:auto;padding:14px 16px;display:grid;gap:12px;align-content:start}
.teach .ex{display:flex;flex-wrap:wrap;gap:6px}
.teach .ex button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:.78rem;cursor:pointer;color:var(--ink-2)}
.teach .ex button:hover{border-color:var(--primary);color:var(--primary)}
.teach .reply{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.teach .prop{display:grid;gap:6px}
.teach .prop label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.86rem}
.teach .prop label:hover{border-color:var(--line)}
.teach .prop small{display:block;color:var(--muted);font-size:.78rem}
.teach .prop .ba{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.8rem}
.teach .ba s{color:var(--muted)}
.teach .hist{border-top:1px solid var(--line-2);padding-top:10px;font-size:.8rem;color:var(--muted)}
.teach .hist li{margin:4px 0}
.rule-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-2);font-size:.88rem}
.rule-row:first-of-type{border-top:0}
.rule-row .chip{flex:none}
.rule-row span.t{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* =====================================================================
   Base glass theme (the accessible learning theme at the end overrides it),
   one consistent set of controls. This layer overrides everything above.
   ===================================================================== */
:root{
  --bg:#e9eae4;
  --glass:rgba(243,243,239,.93); --glass-strong:rgba(248,248,245,.97); --glass-line:rgba(255,255,255,.95);
  --glass-dark:rgba(15,18,13,.88);
  --ink:#0f120d; --ink-2:#272b23; --muted:#535749; --line:rgba(23,28,18,.16); --line-2:rgba(23,28,18,.08);
  --primary:#487037; --primary-hover:#3d6030; --primary-ink:#ffffff; --soft:rgba(72,112,55,.12); --on-soft:#26401b;
  --ring:0 0 0 3px rgba(72,112,55,.28);
  --shadow-sm:0 1px 2px rgba(23,28,18,.06),0 1px 1px rgba(23,28,18,.04);
  --shadow:0 1px 0 #fff inset,0 0 0 1px rgba(23,28,18,.06),0 2px 4px rgba(23,28,18,.06),0 18px 40px -18px rgba(23,28,18,.45);
  --shadow-lg:0 24px 60px -20px rgba(23,28,18,.38);
  --r:16px; --r-sm:10px; --ctl:36px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html{-webkit-font-smoothing:antialiased}
/* SVG drawings use tiny font sizes scaled up: hinted metrics at that size collapse the letters */
svg text{text-rendering:geometricPrecision;letter-spacing:0;font-feature-settings:normal;font-kerning:none}
body{background:var(--bg);font-feature-settings:"cv11","ss01","tnum" 0;letter-spacing:-.003em}
body::before{content:"";position:fixed;inset:-80px;z-index:-2;pointer-events:none;
  background:url(/brand/camo-soft.svg?v=4) 0 0/1200px repeat;filter:blur(44px) saturate(1.1);transform:translateZ(0)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1400px 800px at 70% 0%,rgba(90,100,70,.18),transparent 65%),
             linear-gradient(180deg,rgba(12,15,9,.52) 0%,rgba(12,15,9,.40) 50%,rgba(12,15,9,.50) 100%)}
::selection{background:rgba(72,112,55,.22)}
:focus-visible{outline:none;box-shadow:var(--ring)!important;border-radius:var(--r-sm)}
h1,h2,h3{letter-spacing:-.018em}
.menu{color:#fff;background:rgba(15,18,13,.35);border-radius:10px}

/* glass surfaces */
.card,.pane,.player,.composer,.kpi,.chatwrap,.feat,.idea,.auth-card{
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(60%);backdrop-filter:blur(24px) saturate(60%);
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);border-radius:var(--r)}
.card{padding:22px 24px}
.card h2{font-size:1.02rem;font-weight:650;color:var(--ink)}
.chart-img,.sec,.edit-block{background:rgba(255,255,255,.7);border:1px solid var(--line-2);border-radius:12px}
#layoutEd{background:rgba(255,255,255,.75)!important;border:1px solid var(--line-2)!important;border-radius:12px!important}

/* sidebar: dark frosted glass over the camo */
.side{background:rgba(30,32,25,.9)!important;-webkit-backdrop-filter:blur(26px) saturate(80%);backdrop-filter:blur(26px) saturate(80%);
  border-right:1px solid rgba(255,255,255,.06)!important;padding:16px 12px}
.brand{border-bottom:1px solid rgba(255,255,255,.07)}
.new-btn{height:40px;padding:0 16px;border-radius:12px;font-weight:600;letter-spacing:-.01em;width:calc(100% - 8px);justify-content:center;
  background:linear-gradient(180deg,#56844a,#487037);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(72,112,55,.8);transition:transform .15s var(--ease),filter .15s}
.new-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.nav a,.recent a{border-radius:10px;transition:background .15s var(--ease),color .15s}
.nav a[aria-current=page]{background:rgba(255,255,255,.09);box-shadow:inset 2px 0 0 #8fb77a;color:#fff}
.recent a[aria-current=page]{background:rgba(255,255,255,.09);color:#fff}
.side h3{color:rgba(220,222,210,.55)}
.acct{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;margin:8px 0 0}

/* buttons: one system */
.btn{height:var(--ctl);padding:0 14px;border-radius:var(--r-sm);font-weight:600;font-size:.86rem;letter-spacing:-.005em;gap:7px;
  background:#fff;border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow-sm);
  transition:background .15s var(--ease),border-color .15s,box-shadow .15s,transform .15s var(--ease)}
.btn:hover{background:#fff;border-color:rgba(40,46,34,.24);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px;opacity:.8}
.btn.primary{background:linear-gradient(180deg,#538045,#487037);border-color:#3f6431;color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 14px -6px rgba(72,112,55,.7)}
.btn.primary:hover{background:linear-gradient(180deg,#5b8b4c,#4d773b)}
.btn.primary svg{opacity:1}
.btn.tonal{background:linear-gradient(180deg,#6b7346,#5b6236);border-color:#4f5530;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 14px -6px rgba(70,76,40,.7)}
.btn.tonal:hover{background:linear-gradient(180deg,#737b4c,#62693a)}
.btn.tonal svg{opacity:1}
a.btn,a.btn:hover{text-decoration:none}
.study-top>.btn.text{background:rgba(255,255,255,.88);border:1px solid #fff;color:var(--ink-2);box-shadow:var(--shadow-sm);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.study-top>.btn.text:hover{background:#fff}
.chart-head a{text-decoration:none;font-weight:600}
.btn.text{background:transparent;border-color:transparent;box-shadow:none;color:var(--primary)}
.btn.text:hover{background:rgba(72,112,55,.08);transform:none}
.btn:disabled,.btn:disabled:hover{opacity:1;transform:none;cursor:default;color:rgba(40,46,34,.38)!important;background:rgba(255,255,255,.42)!important;border-color:var(--line)!important;box-shadow:none!important}
.btn:disabled svg{opacity:.4}
.iconbtn{border-radius:10px;transition:background .15s}
.iconbtn:hover{background:rgba(40,46,34,.07)}
.go{border-radius:12px;background:linear-gradient(180deg,#538045,#487037);box-shadow:0 6px 14px -6px rgba(72,112,55,.7)}
.go:disabled{background:rgba(40,46,34,.08);box-shadow:none}

/* tabs: segmented control */
.study-top{gap:14px 16px;margin:6px 0 18px;align-items:center}
.study-top h1{font-size:1.65rem;font-weight:750;letter-spacing:-.025em;color:var(--ink)}
.study-top .title{background:rgba(243,243,239,.93);-webkit-backdrop-filter:blur(18px) saturate(60%);backdrop-filter:blur(18px) saturate(60%);border:1px solid #fff;border-radius:14px;padding:10px 16px;box-shadow:var(--shadow-sm);flex:0 1 auto}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tabs{display:inline-flex;gap:2px;padding:4px;border:1px solid rgba(255,255,255,.9);border-bottom:1px solid rgba(255,255,255,.9);border-radius:14px;
  background:rgba(238,238,233,.9);-webkit-backdrop-filter:blur(16px) saturate(60%);backdrop-filter:blur(16px) saturate(60%);box-shadow:var(--shadow-sm)}
.tabs a{height:34px;padding:0 14px;border-radius:10px;border-bottom:0;margin:0;font-size:.86rem;font-weight:560;color:var(--ink-2);transition:background .15s var(--ease),color .15s}
.tabs a:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.tabs a[aria-selected=true]{background:var(--primary);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 14px -6px rgba(72,112,55,.8)}
.tabs a[aria-selected=true] svg{color:#fff}
.tabs svg{width:15px;height:15px}
.bar-actions{gap:6px}
.bar-actions .btn{height:32px;font-size:.82rem;padding:0 12px}

/* inputs */
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;min-height:var(--ctl);padding:7px 11px;
  transition:border-color .15s,box-shadow .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:rgba(40,46,34,.26)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring);background:#fff}
.loc-tbl input,.loc-tbl select{min-height:32px;padding:4px 8px;border-radius:8px}
label.f{color:var(--muted);font-weight:500;font-size:.78rem}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:16px;height:16px}

/* tables */
.tbl{font-size:.85rem}
.tbl th{background:transparent;color:#4a4e42;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.tbl td{border-bottom:1px solid var(--line-2)}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover td{background:rgba(255,255,255,.55)}
.bd-tbl tr.sel td{background:rgba(72,112,55,.10)}

/* notices, chips */
.warnbox,.okbox{border-radius:12px;padding:11px 14px;font-size:.85rem;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.warnbox{background:rgba(255,243,214,.78);border:1px solid rgba(201,162,39,.35);border-left:3px solid #c9a227;color:#6a4f00}
.okbox{background:rgba(226,240,220,.8);border:1px solid rgba(72,112,55,.25);border-left:3px solid var(--primary);color:#2c4a21}
.chip{background:rgba(40,46,34,.07);color:var(--ink-2);border-radius:999px;font-weight:550}
.toast{background:rgba(20,23,18,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:11px 16px}

/* home */
.hello{font-size:2.3rem;font-weight:800;letter-spacing:-.035em;color:#fff;text-shadow:0 2px 18px rgba(15,18,13,.35)}
.hello-sub{font-size:1.05rem;color:rgba(255,255,255,.92);text-shadow:0 1px 10px rgba(15,18,13,.4);font-weight:500}
.drop{border:1.5px dashed rgba(40,46,34,.22);border-radius:14px;background:rgba(255,255,255,.4);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--primary);background:rgba(72,112,55,.06)}
.feat .ic{background:rgba(72,112,55,.12);color:var(--on-soft);border-radius:10px}
a.feat:hover{background:var(--glass-strong)}

/* teach */
.teach-fab{height:44px;padding:0 18px;border-radius:14px;background:var(--glass-dark)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08)!important;box-shadow:var(--shadow-lg),0 0 0 4px rgba(72,112,55,.14);transition:transform .15s var(--ease)}
.teach-fab:hover{transform:translateY(-2px)}
.teach-fab svg{color:#9fc48a}
.teach{background:rgba(238,238,233,.96);-webkit-backdrop-filter:blur(28px) saturate(60%);backdrop-filter:blur(28px) saturate(60%);
  border-left:1px solid var(--glass-line);box-shadow:-24px 0 60px -20px rgba(23,28,18,.35)}
.teach .reply{background:rgba(255,255,255,.75);border:1px solid var(--line-2)}
.teach .prop label{background:rgba(255,255,255,.65);border-color:var(--line-2);border-radius:12px}
.teach .prop label:hover{border-color:rgba(72,112,55,.35)}
.teach .ex button{background:rgba(255,255,255,.7)}

/* sign-in */
.auth-wrap{background:transparent}
.auth-side{background:rgba(20,23,18,.55)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.auth-side .panel{background:rgba(20,23,18,.62);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--primary);border-radius:16px}
.auth-card{padding:30px}
.auth-tabs{border-bottom:0;background:rgba(40,46,34,.06);border-radius:12px;padding:4px;gap:2px}
.auth-tabs button{border-bottom:0;margin:0;border-radius:9px;height:34px;padding:0}
.auth-tabs button[aria-selected=true]{background:#fff;box-shadow:0 1px 2px rgba(23,28,18,.1)}
.seg2 label{border-radius:10px;background:rgba(255,255,255,.6)}

/* video and timeline */
video{border-radius:12px}
.timeline{border-radius:10px;background:rgba(255,255,255,.7)}

@media (prefers-reduced-transparency:reduce){
  .card,.pane,.player,.composer,.kpi,.side,.teach,.tabs{-webkit-backdrop-filter:none;backdrop-filter:none;background:#f7f7f3}
  .side{background:#22251f!important}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.pane,.player,.composer,.kpi{background:rgba(255,255,255,.94)}
}
/* =====================================================================
   Accessible learning theme. Calm and high-contrast, with large targets
   and a focus ring that is never subtle. Overrides the layers above.
   ===================================================================== */
:root{
  --bg:#f3f5f8; --surface:#fff; --surface-2:#f7f9fb;
  --ink:#0d1520; --ink-2:#1f2a37; --muted:#4b5767; --line:#c9d2dc; --line-2:#e3e8ee;
  --primary:#0b5cad; --primary-hover:#094c90; --soft:#e5f0fb; --on-soft:#083b70;
  --accent:#ffbf1f; --side:#0c1f33; --side-ink:#f1f5f9; --side-muted:#a9b8c8;
  --ring:0 0 0 3px #fff,0 0 0 6px #ffbf1f;
  --shadow-sm:0 1px 2px rgba(13,21,32,.06);
  --shadow:0 1px 3px rgba(13,21,32,.08),0 8px 24px -14px rgba(13,21,32,.25);
  --r:14px; --r-sm:10px; --ctl:42px;
}
body{font-size:16px;background:var(--bg);color:var(--ink);letter-spacing:0}
html.big body{font-size:19px}
body::before,body::after{content:none;display:none}
:focus-visible{outline:3px solid #0d1520!important;outline-offset:3px;box-shadow:var(--ring)!important}
a{color:var(--primary)}
.muted{color:var(--muted)}

/* solid surfaces: no blur, no camo */
.card,.pane,.player,.composer,.kpi,.chatwrap,.feat,.idea,.auth-card,.study-top .title,.tabs{
  background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  border:1px solid var(--line-2)!important;box-shadow:var(--shadow)}
.chart-img,.sec,.edit-block{background:var(--surface-2);border:1px solid var(--line-2)}

/* sidebar */
.side{background:var(--side)!important;-webkit-backdrop-filter:none;backdrop-filter:none;border-right:0!important}
.brand .mark{background:#fff}
.brand b{letter-spacing:.08em}
.brand .ls{color:var(--accent)}
.brand small{color:#cfe0f2;font-size:.78rem}
.new-btn{background:var(--accent)!important;color:#1a1300!important;box-shadow:none!important;height:46px;font-size:.98rem}
.new-btn svg{color:#1a1300}
.nav a,.recent a{color:var(--side-ink);font-size:.95rem;padding:10px 12px}
.nav a[aria-current=page],.recent a[aria-current=page]{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--accent);color:#fff}
.side h3{color:var(--side-muted)!important;font-size:.75rem}
.side .foot{color:var(--side-muted);font-size:.8rem;line-height:1.45}
.a11y{display:grid;gap:6px;margin-top:auto;padding:8px 4px 0}
.a11y-btn{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
  background:transparent;color:var(--side-ink);cursor:pointer;font-weight:600;font-size:.9rem;text-align:left}
.a11y-btn svg{width:18px;height:18px}
.a11y-btn .aa{font-weight:800;width:18px}.a11y-btn .aa span{font-size:1.25em}
.a11y-btn:hover{background:rgba(255,255,255,.08)}
.a11y-btn[aria-pressed=true]{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.side .foot{margin-top:8px}

/* buttons */
.btn{height:var(--ctl);font-size:.95rem;background:#fff;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn:hover{border-color:var(--primary);background:#fff}
.btn.primary,.btn.tonal,.go{background:var(--primary)!important;border-color:var(--primary)!important;color:#fff;box-shadow:none!important}
.btn.primary:hover,.btn.tonal:hover,.go:hover{background:var(--primary-hover)!important}
.go:disabled{background:#d5dce4!important}
.btn.text{color:var(--primary);border-color:transparent;background:transparent}
.btn.text:hover{background:var(--soft)}
.bar-actions .btn{height:38px;font-size:.9rem}

/* home */
.home{max-width:980px;padding-top:28px}
.kicker{margin:0 0 6px;color:var(--primary);font-weight:700;font-size:.95rem;letter-spacing:.01em}
.hello{color:var(--ink);text-shadow:none;font-size:2.5rem;line-height:1.1}
.hello-sub{color:var(--ink-2);text-shadow:none;font-size:1.15rem;line-height:1.5;max-width:760px;margin:10px 0 22px}
.drop{border:2px dashed var(--line);background:var(--surface-2);padding:26px}
.drop b{font-size:1.1rem}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
label.f{color:var(--ink-2);font-size:.9rem;font-weight:600}
.features{grid-template-columns:repeat(4,1fr)!important;gap:12px;margin:24px 0}
.feat{padding:18px}
.feat b{font-weight:700;font-size:1rem;margin:10px 0 4px}
.feat span{color:var(--muted);font-size:.9rem;line-height:1.45}
.feat .ic{background:var(--soft);color:var(--primary)}
.sec-title{font-size:1.2rem;margin:8px 0 10px}
.lessons{display:grid;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1.5px solid var(--line-2);border-radius:var(--r);
  text-decoration:none;color:var(--ink);box-shadow:var(--shadow-sm)}
.lesson:hover{border-color:var(--primary)}
.lesson-ic{width:42px;height:42px;border-radius:10px;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
.lesson-ic svg{width:22px;height:22px}
.lesson-b{display:flex;flex-direction:column;flex:1;min-width:0}
.lesson-b b{font-size:1.05rem}
@media (max-width:900px){.features{grid-template-columns:1fr 1fr!important}.grid2{grid-template-columns:1fr}.hello{font-size:2rem}}
@media (max-width:560px){.features{grid-template-columns:1fr!important}}

/* lesson header and tabs */
.study-top h1{font-size:1.7rem;color:var(--ink)}
.eyebrow{color:var(--primary);font-size:.8rem}
.tabs a{height:40px;font-size:.95rem;color:var(--ink-2)}
.tabs a:hover{background:var(--soft)}
.tabs a[aria-selected=true]{background:var(--primary);color:#fff;box-shadow:none}

/* learn view */
.step-no{font-size:.9rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em}
.center h2{font-size:1.5rem;font-weight:700;line-height:1.25}
.vwrap{position:relative;flex:1;min-height:0;display:flex;background:#000}
.vwrap video{border-radius:0}
.cap{background:#0d1520;color:#fff;font-size:1.2rem;line-height:1.35;font-weight:600;padding:10px 16px;text-align:center;
  min-height:calc(2.7em + 20px);display:flex;align-items:center;justify-content:center}
html.big .cap{font-size:1.5rem}
.icon.cc{font-weight:800;font-size:.82rem;width:38px;height:32px;border-radius:8px;border:2px solid currentColor;justify-content:center;align-items:center}
.icon[aria-pressed=false]{color:#8a95a3}
.ctrl-row{font-size:.95rem}
.play{width:46px;height:46px}
.keys{font-size:.85rem;margin:8px 2px 0}
kbd{font:600 .8rem/1 var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px;background:#fff;color:var(--ink)}
.step{border-radius:12px;padding:12px 14px}
.step .st-title{font-weight:600}
.step[aria-selected=true]{background:var(--soft)!important;box-shadow:inset 3px 0 0 var(--primary)}
.step .st-meta{font-size:.85rem}
.unclear{color:#8a4b00;font-weight:600}
.sec{border-radius:12px}
.sec-h{font-weight:700;font-size:.95rem}
.explain{padding:14px 16px;gap:10px}
.explain .plain{margin:0;font-size:1.1rem;line-height:1.5;font-weight:500;color:var(--ink)}
.facts{display:grid;gap:6px;font-size:.92rem}
.facts span{display:flex;justify-content:space-between;gap:12px}
.facts b{color:var(--muted);font-weight:600}
.tr li{font-size:.95rem}
.tr li[aria-current=true]{background:var(--soft);color:var(--on-soft);font-weight:600}
.howto{margin:8px 0 0;padding-left:18px;display:grid;gap:8px;line-height:1.45}
.bd-tbl tr.sel td{background:var(--soft)}
.bd-tbl tr{cursor:pointer}
.tbl{font-size:.92rem}
.tbl th{color:var(--ink-2);font-size:.78rem}
.warnbox,.okbox{background:#eef3f8;border:1px solid var(--line-2);border-left:3px solid #7b8ca3;color:var(--ink-2);-webkit-backdrop-filter:none;backdrop-filter:none}
input.guess,select.guess{border-style:dashed;border-color:#8a9bb0}
.btn.primary:disabled,.btn.primary:disabled:hover{background:#dfe5ec!important;border-color:#dfe5ec!important;color:#5b6573!important}

/* learn view: one column, the video carries the weight */
.learn{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.learn .center{gap:10px}
.learn-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.learn-head h2{margin:2px 0 0;font-size:1.7rem}
.learn-head .cycle-pick{padding:0;min-width:220px}
.learn .player{flex:none;border-radius:16px}
.learn .vwrap{flex:none;height:min(62vh,620px)}
.strip{list-style:none;margin:4px 0 0;padding:4px 2px 6px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.strip li{flex:none}
.strip .step{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-weight:700;font-size:1rem;color:var(--ink-2);cursor:pointer;box-shadow:none}
.strip .step:hover{border-color:var(--primary)}
.strip .step[aria-selected=true]{background:var(--primary)!important;border-color:var(--primary);color:#fff;box-shadow:none}
.strip .unclear-step{border-style:dashed}
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start;background:none;border:0;padding:0}
.about-main .explain{background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow-sm)}
.about-main .plain{font-size:1.25rem!important}
.about-main .facts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;margin-top:6px}
.about-main .facts span{flex-direction:column;justify-content:flex-start;gap:2px}
.about-side{display:grid;gap:10px}
.about-side .sec{background:#fff}
.moments{grid-column:1/-1;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:4px 6px}
.moments summary{cursor:pointer;font-weight:700;padding:10px 12px;list-style-position:inside}
.moments .sec{background:none;border:0}
.moments .sec-h{display:none}
.about:has(.edit-block){display:flex;flex-direction:column}
@media (max-width:860px){.about{grid-template-columns:1fr}.learn .vwrap{height:46vh}.learn-head h2{font-size:1.35rem}}

/* suggest a fix */
.teach-fab{background:var(--side)!important;color:#fff;border:0!important;box-shadow:var(--shadow)}
.teach-fab svg{color:var(--accent)}
.teach{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;border-left:1px solid var(--line)}
.toast{background:#0d1520}

/* sign-in */
.auth-side{background:var(--side)!important}

/* high contrast */
html.hc{--bg:#fff;--surface:#fff;--surface-2:#fff;--ink:#000;--ink-2:#000;--muted:#1a1a1a;--line:#000;--line-2:#000;--primary:#00387a;--primary-hover:#002a5c;--soft:#ffe98a;--on-soft:#000}
html.hc .card,html.hc .pane,html.hc .player,html.hc .composer,html.hc .feat,html.hc .lesson,html.hc .sec,html.hc .tabs,html.hc .study-top .title,html.hc .btn{border:2px solid #000!important;box-shadow:none!important}
html.hc .side{background:#000!important}
html.hc .cap{background:#000;color:#ffe600;border:2px solid #fff;font-size:1.4rem}
html.hc .tr li[aria-current=true],html.hc .step[aria-selected=true]{outline:2px solid #000}
html.hc .muted{color:#1a1a1a}
</style>

<script>

const mmss = s => { s = Math.max(0, Math.round(s)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 401 && CFG.auth && !path.startsWith("/api/auth/")) { renderAuth(); throw new Error("Please sign in."); }
  if (!r.ok) {
    let msg = `${r.status} ${r.statusText}`;
    try { const j = await r.json(); if (j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch {}
    throw new Error(msg);
  }
  return r;
}

/* small, safe markdown for copilot answers: escape first, then format */
function md(src) {
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>").replace(/(^|\W)_([^_\n]+)_(?!\w)/g, "$1<i>$2</i>");
  const lines = esc(src).split("\n"); let out = "", i = 0;
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:-]+(\|[\s:-]+)+\|?\s*$/.test(lines[i + 1])) {
      out += `<table><thead><tr>${cells(l).map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>`; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { out += `<tr>${cells(lines[i]).map(c => `<td>${c}</td>`).join("")}</tr>`; i++; }
      out += "</tbody></table>"; continue;
    }

    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const n = Math.min(3, m[1].length); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d+[.)]/.test(l); out += ordered ? "<ol>" : "<ul>";
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, ""))}</li>`; i++; }
      out += ordered ? "</ol>" : "</ul>"; continue;
    }
    if (!l.trim()) { i++; continue; }
    let p = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*([-*•]|\d+[.)])\s+|\s*\|)/.test(lines[i])) { p.push(inline(lines[i])); i++; }
    if (p.length) out += `<p>${p.join("<br>")}</p>`; else { out += `<p>${inline(l)}</p>`; i++; }
  }
  return out;
}

let recStream = null;
function stopCamera() { if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; } }
function setupRecorder(pick) {
  const btn = document.getElementById("recBtn"), state = document.getElementById("recState"), prev = document.getElementById("recPrev");
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { btn.disabled = true; btn.title = "Camera recording needs localhost or https"; return; }
  let rec = null, chunks = [], t0 = 0, tick = null;
  btn.onclick = async () => {
    if (rec) { rec.stop(); return; }
    try { recStream = await navigator.mediaDevices.getUserMedia({audio: false, video: {width: {ideal: 1920}, height: {ideal: 1080}, facingMode: "environment"}}); }
    catch (e) { state.textContent = `Camera not available: ${e.message}`; return; }
    prev.srcObject = recStream; prev.hidden = false; prev.play();
    const type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(recStream, type ? {mimeType: type} : {}); chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      clearInterval(tick); stopCamera(); prev.hidden = true; prev.srcObject = null;
      const mime = rec.mimeType || "video/webm", ext = mime.includes("mp4") ? "mp4" : "webm";
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      pick(new File(chunks, `recording-${stamp}.${ext}`, {type: mime}));
      state.textContent = `Recorded ${Math.round((Date.now() - t0) / 1000)} s`;
      btn.innerHTML = `${ICON.cam}Record again`; rec = null;
    };
    rec.start(1000); t0 = Date.now(); btn.innerHTML = `${ICON.cam}Stop`;
    tick = setInterval(() => { state.innerHTML = `<span class="recdot"></span>Recording ${Math.round((Date.now() - t0) / 1000)} s`; }, 250);
  };
}

function renderEditTools() {

/* transcript */
const rel = (t, s) => `+${Math.max(0, t - s.start).toFixed(1)} s`;
function transcriptSection(s) {
  let body;
  if (!s) body = `<div class="empty">Select a step.</div>`;
  else if (editing) {
    body = `<textarea id="l_transcript" rows="8" aria-label="Transcript, one action per line" placeholder="1.5 Right hand picks the fitting from the bin">${esc((s.transcript || []).map(l => `${Math.max(0, l.t - s.start).toFixed(1)} ${l.text}`).join("\n"))}</textarea>
      <div class="muted" style="font-size:.8rem;margin-top:4px">One action per line, starting with seconds from the step start.</div>`;
  } else if (s.transcript && s.transcript.length) {
    body = `<ol class="tr">${s.transcript.map(l => `<li data-t="${l.t}"><span class="ts">${rel(l.t, s)}</span><span>${esc(l.text)}</span></li>`).join("")}</ol>`;
  } else {
    const any = cycleSteps().some(x => x.transcript && x.transcript.length);
    body = any ? `<div class="empty">None for this step.</div>`
               : `<div class="empty">Not written out yet.</div><button class="btn tonal" id="trBtn" style="margin-top:8px;align-self:flex-start">${TABICON.copilot.replace("<svg", '<svg width="16" height="16"')}Write out what the hands do</button>`;
  }
  return `<div class="sec"><div class="sec-h">What the hands do <span class="muted" style="font-weight:500">· tap a line to see it</span></div><div class="sec-b">${body}</div></div>`;
}
function parseTranscript(text, s) {
  const out = [];
  for (const raw of text.split("\n")) {
    const line = raw.trim(); if (!line) continue;
    const m = line.match(/^\+?(\d+(?:\.\d+)?)\s*s?\s+(.+)$/);
    const off = m ? +m[1] : (out.length ? out[out.length - 1].t - s.start : 0);
    out.push({t: Math.round(Math.min(s.start + off, s.end) * 100) / 100, text: m ? m[2].trim() : line});
  }
  return out.sort((a, b) => a.t - b.t);
}
function highlightLine() {
  const items = [...document.querySelectorAll(".tr li")]; if (!items.length || !vid) return;
  let cur = null;
  for (const li of items) if (+li.dataset.t <= vid.currentTime + 0.05) cur = li;
  items.forEach(li => li.setAttribute("aria-current", li === cur));
}
async function transcribeCycle(btn) {
  if (dirty && !(await save())) return;
  btn.disabled = true; btn.textContent = "Writing it out…";
  try {
    const fresh = await (await api(`/api/studies/${S.id}/transcribe?cycle=${curCycle}`, {method: "POST"})).json();
    Object.assign(S, fresh); renderAll(false); toast("Written out");
  } catch (e) { btn.disabled = false; btn.textContent = "Write out what the hands do"; toast(`Could not write it out: ${e.message}`); }
}

/* playback */
function stepAt(t) { return cycleSteps().find(s => t >= s.start && t < s.end) || null; }
function updateCaption() {
  const cap = document.getElementById("cap"); if (!cap || !vid) return;
  const on = document.getElementById("ccBtn")?.getAttribute("aria-pressed") === "true";
  const s = stepAt(vid.currentTime) || curStep();
  let line = null;
  for (const l of (s?.transcript || [])) if (l.t <= vid.currentTime + 0.05) line = l;
  const text = on && line ? line.text : "";
  if (cap.textContent !== text) cap.textContent = text;
  cap.hidden = !on;
}
function onTime() {
  movePlayhead(); highlightLine(); updateCaption();
  const s = curStep(); if (!s || vid.paused) return;
  if (document.getElementById("loopBtn").getAttribute("aria-pressed") === "true") {
    if (vid.currentTime >= s.end - 0.03 || vid.currentTime < s.start - 0.3) vid.currentTime = s.start;
  } else {
    const at = stepAt(vid.currentTime);
    if (at && at.id !== curStepId) { curStepId = at.id; renderAll(false); }
  }
}
document.addEventListener("keydown", e => {
  if (!vid || curTab !== "instructions" || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === " ") { e.preventDefault(); vid.paused ? vid.play().catch(() => {}) : vid.pause(); }
  if (e.key === "ArrowDown") { e.preventDefault(); stepBy(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); stepBy(-1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); vid.pause(); vid.currentTime += e.key === "ArrowRight" ? 0.1 : -0.1; }
});

/* boundary edits */
const MIN = 0.1;
function setStart(s, t) {
  if (!s) return;
  const list = cycleSteps(), i = list.indexOf(s), c = cycleOf(curCycle);
  let lo; const hi = s.end - MIN;
  if (i === 0) {
    const prev = S.cycles.filter(x => x.end <= c.start + 0.01 && x.index !== c.index).sort((a, b) => b.end - a.end)[0];
    lo = prev ? prev.end : 0;
  } else lo = list[i - 1].start + MIN;
  if (t < lo || t > hi) { toast(`Start must be between ${mmss(lo)} and ${mmss(hi)}.`); return; }
  t = Math.round(t * 100) / 100;
  if (i === 0) c.start = t; else list[i - 1].end = t;
  s.start = t; s.edited = true; markDirty(); renderAll(false);
}
function setEndHere() {
  const s = curStep(); if (!s) return;
  const list = cycleSteps(), i = list.indexOf(s), t = vid.currentTime;
  if (i < list.length - 1) { setStart(list[i + 1], t); return; }
  const c = cycleOf(curCycle);
  const next = S.cycles.filter(x => x.start >= c.end - 0.01 && x.index !== c.index).sort((a, b) => a.start - b.start)[0];
  const hi = next ? next.start : S.duration;
  if (t < s.start + MIN || t > hi) { toast(`End must be between ${mmss(s.start + MIN)} and ${mmss(hi)}.`); return; }
  s.end = c.end = Math.round(t * 100) / 100; s.edited = true; markDirty(); renderAll(false);
}
function split() {
  const s = curStep(), t = Math.round(vid.currentTime * 100) / 100;
  if (!s || t <= s.start + MIN || t >= s.end - MIN) { toast("Move the playhead inside the selected step to split it."); return; }
  const n = {...s, id: newId("s"), element_id: newId("E"), start: t, title: `${s.title} (2)`, tools: [...s.tools], materials: [...s.materials], key_points: [...s.key_points], edited: true};
  n.transcript = (s.transcript || []).filter(l => l.t >= t);
  s.transcript = (s.transcript || []).filter(l => l.t < t);
  s.end = t; s.edited = true; S.steps.push(n); markDirty(); selectStep(n.id, false);
}
function merge() {
  const s = curStep(), list = cycleSteps(), n = list[list.indexOf(s) + 1];
  if (!s || !n) { toast("There is no next step to merge with."); return; }
  s.end = n.end; s.edited = true;
  s.transcript = [...(s.transcript || []), ...(n.transcript || [])];
  if (n.description) s.description = [s.description, n.description].filter(Boolean).join(" ");
  S.steps = S.steps.filter(x => x !== n); markDirty(); renderAll(false);
}
function removeStep() {
  const s = curStep(), list = cycleSteps(), i = list.indexOf(s);
  if (!s) return;
  if (list.length === 1) { toast("A cycle needs at least one step."); return; }
  if (!confirm(`Delete "${s.title}"? Its time goes to the neighbouring step.`)) return;
  if (i > 0) list[i - 1].end = s.end; else list[1].start = s.start;
  S.steps = S.steps.filter(x => x !== s); curStepId = (list[i - 1] || list[1]).id; markDirty(); renderAll(true);
}

/* ------------------------------------------------------------ time study math (mirrors the .xlsx) */
const rnd = x => { const k = 10 ** (CFG.sheet_decimals || 0); return Math.round(x * k) / k; };
function lowestRepeatable(vals) {
  if (!vals.length) return [null, false];
  const n = new Map(); vals.forEach(v => n.set(v, (n.get(v) || 0) + 1));
  const rep = [...n].filter(([, c]) => c >= 2).map(([v]) => v);
  return rep.length ? [Math.min(...rep), false] : [Math.min(...vals), true];
}
function studyStats(st) {
  const rep = st.representative_cycle, cyc = [...st.cycles].sort((a, b) => a.index - b.index);
  const normal = cyc.filter(c => !c.abnormal).map(c => c.index);
  const totals = Object.fromEntries(cyc.map(c => [c.index, rnd(c.end - c.start)]));
  const [T] = lowestRepeatable(normal.map(i => totals[i]));
  const repS = st.steps.filter(s => s.cycle === rep).sort((a, b) => a.start - b.start);
  const order = new Map();
  [...repS, ...st.steps.filter(s => s.cycle !== rep).sort((a, b) => a.cycle - b.cycle || a.start - b.start)]
    .forEach(s => { if (!order.has(s.element_id)) order.set(s.element_id, s); });
  const elements = [...order].map(([eid, s0]) => {
    const per = {};
    cyc.forEach(c => { const ss = st.steps.filter(s => s.cycle === c.index && s.element_id === eid); if (ss.length) per[c.index] = rnd(ss.reduce((a, s) => a + s.end - s.start, 0)); });
    const vals = normal.filter(i => i in per).map(i => per[i]);
    const [lr, fb] = lowestRepeatable(vals), hi = vals.length ? Math.max(...vals) : null;
    return {eid, title: s0.title, category: s0.category, per, lr, fallback: fb, hi, fl: lr != null && hi != null ? rnd(hi - lr) : null};
  });
  const sumT = rnd(elements.reduce((a, e) => a + (e.lr || 0), 0));
  const split = Object.fromEntries(CATS.map(k => [k, repS.filter(s => s.category === k).reduce((a, s) => a + s.end - s.start, 0)]));
  const repTotal = CATS.reduce((a, k) => a + split[k], 0);
  const nt = normal.map(i => totals[i]);
  return {cyc, normal, totals, T, elements, sumT, split, repTotal, repS, flCycle: nt.length ? rnd(Math.max(...nt) - T) : null,
          takt: parseFloat(String(st.header?.takt || "").replace(",", ".")) || null};
}

/* single-series bar chart with an optional reference line */
function barChart({items, max, ref, refLabel, unit = "s"}) {
  const top = Math.max(max, ref || 0) * 1.12 || 1;
  const step = niceStep(top), grid = [];
  for (let v = step; v < top; v += step) grid.push(v);
  return `<div class="bars">
    ${grid.map(v => `<div class="gl" style="bottom:${v / top * 100}%"><span>${+v.toFixed(1)}</span></div>`).join("")}
    ${ref ? `<div class="ref" style="bottom:${ref / top * 100}%"><span>${esc(refLabel)}</span></div>` : ""}
    ${items.map(it => `<div class="bar${it.x ? " x" : ""}${it.hot ? " hot" : ""}" style="height:${it.segs.reduce((a, s) => a + s.v, 0) / top * 100}%" ${it.tip ? `data-tip="${esc(it.tip)}"` : ""}>
      ${it.segs.map(s => `<div class="s" style="flex:${Math.max(s.v, 0.0001)};background:${s.c}" ${s.tip ? `data-tip="${esc(s.tip)}"` : ""}></div>`).join("")}
      <div class="val">${it.label ?? ""}</div></div>`).join("")}
  </div><div class="xl">${items.map(it => `<span title="${esc(it.name)}">${esc(it.name)}</span>`).join("")}</div>`;
}
function niceStep(top) { const raw = top / 4, p = 10 ** Math.floor(Math.log10(raw)), n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
const COLOR = {value_add: "var(--va)", necessary_nva: "var(--nnva)", waste: "var(--waste)"};
const legend = () => `<div class="legend">${CATS.map(k => `<span><i style="background:${COLOR[k]}"></i>${CAT[k]}</span>`).join("")}</div>`;

      <div class="scroll-x"><table class="tbl">

        <tbody>${st.elements.map((e, i) => `<tr><td>${i + 1}</td><td><span class="sw ${e.category}"></span>${esc(e.title)}</td>${st.cyc.map(c => {
          const v = e.per[c.index]; if (v == null) return `<td class="num"></td>`;
          const cls = c.abnormal ? "x" : (v === e.hi && e.hi !== e.lr ? "hi" : v === e.lr ? "lo" : "");
          return `<td class="num ${cls}">${v}</td>`; }).join("")}
          <td class="num">${e.lr ?? ""}${e.fallback ? "*" : ""}</td><td class="num">${e.hi ?? ""}</td><td class="num">${e.fl ?? ""}</td></tr>`).join("")}
          <tr><td></td><td><b style="font-weight:500">Cycle total</b></td>${st.cyc.map(c => `<td class="num ${c.abnormal ? "x" : ""}">${st.totals[c.index]}</td>`).join("")}<td class="num"><b style="font-weight:500">T ${st.T ?? ""}</b></td><td></td><td class="num">${st.flCycle ?? ""}</td></tr>

/* ------------------------------------------------------------ tab: kaizen */
let actTimer = null;
function renderKaizen() {

    document.getElementById("bdTitle").textContent = `Step ${n}: ${r.title}`;
    if (r.start != null) { v.currentTime = r.start; if (play) v.play().catch(() => {}); }
  };
  v.addEventListener("loadedmetadata", () => show(bdStep, false), {once: true});
  v.addEventListener("timeupdate", () => { const r = rows.find(x => x.n === bdStep); if (r && r.start != null && !v.paused && (v.currentTime >= r.end - 0.03 || v.currentTime < r.start - 0.3)) v.currentTime = r.start; });
  document.querySelectorAll("[data-row]").forEach(t => { t.onclick = () => show(+t.dataset.row, true); t.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(+t.dataset.row, true); } }; });
  if (bdStep != null) { const r = rows.find(x => x.n === bdStep); document.getElementById("bdTitle").textContent = `Step ${r.n}: ${r.title}`; }
}

  return `<div class="${rep.mae != null && rep.mae <= 0.5 ? "okbox" : "warnbox"}" style="margin-top:10px">Accuracy on your marked cycle(s), timed blind:
      <ul style="margin:6px 0 0 18px;padding:0">${two ? line("Gemini", rep.gemini) + line("Alignment", rep.aligned) + line("Used (better one per element)", rep) : line("Gemini", rep)}</ul></div>
    <div class="scroll-x"><table class="tbl" style="margin-top:8px"><thead><tr><th>Cycle</th><th>#</th><th>Element</th><th class="num">Your mark</th><th class="num">Gemini</th>${two ? '<th class="num">Error</th><th class="num">Alignment</th><th class="num">Error</th><th>Used</th>' : '<th class="num">Error (s)</th>'}</tr></thead><tbody>
    ${(rep.rows || []).map(r => `<tr><td>${r.cycle ?? ""}</td><td>${els.findIndex(e => e.id === r.element_id) + 1}</td><td>${esc((els.find(e => e.id === r.element_id) || {}).name || r.element_id)}</td><td class="num">${r.marked != null ? fmtT(r.marked) : "–"}</td>
      <td class="num">${r.gemini != null ? fmtT(r.gemini) : "–"}</td>${two ? `<td class="num">${err(r.error_gemini)}</td><td class="num">${r.aligned != null ? fmtT(r.aligned) : "–"}</td><td class="num">${err(r.error_aligned)}</td><td>${used(r)}</td>` : `<td class="num">${err(r.error)}</td>`}</tr>`).join("")}</tbody></table></div>`;

function bindCalibration() {
  const al = document.getElementById("calAlign");
  if (al) al.onclick = async () => {
    if (tplDirty && !(await saveTemplate())) return;
    try { await api(`/api/studies/${S.id}/align`, {method: "POST"}); const id = S.id; S = null; openStudy(id); } catch (e) { toast(e.message); }
  };
  const start = document.getElementById("calStart");
  const marked = (STPL.references || []).filter(r => r.study_id === S.id).map(r => r.cycle_start);
  const isMarked = c => marked.some(t => Math.abs(t - c.start) <= 3);
  if (start) start.onclick = () => {
    calMode = true; calIdx = 0; calMarks = {};
    const normal = S.cycles.filter(c => !c.abnormal && !c.x_suggested && !isMarked(c));
    calCycle = (normal.find(c => c.index === S.representative_cycle) || normal[0] || S.cycles[0]).index;
    renderTemplateTab();
  };
  document.querySelectorAll("[data-redo]").forEach(b => b.onclick = () => {
    const r = STPL.references.find(x => x.rid === b.dataset.redo); if (!r) return;
    if (r.study_id !== S.id) { toast(`That cycle is from study #${r.study_number}. Open that study to re-mark it.`); return; }
    const c = S.cycles.find(x => Math.abs(x.start - r.cycle_start) <= 3) || S.cycles[0];
    calMode = true; calIdx = 0; calMarks = {...r.marks}; calCycle = c.index; renderTemplateTab();
  });
  document.querySelectorAll("[data-delref]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this reference cycle?")) return;
    try { const j = await (await api(`/api/stations/${stationKey()}/reference/${b.dataset.delref}`, {method: "DELETE"})).json(); STPL = j.template; STPL_ISSUES = j.issues; STPL_GRID = j.grid; renderTemplateTab(); } catch (e) { toast(e.message); }
  });
  if (!calMode) return;
  const v = document.getElementById("calVid"), now = document.getElementById("calNow");
  const cyc = () => S.cycles.find(c => c.index === calCycle);
  v.playbackRate = 0.5;
  v.addEventListener("loadedmetadata", () => { const e = STPL.elements[calIdx]; v.currentTime = calMarks[e?.id] ?? cyc().start; }, {once: true});
  v.addEventListener("timeupdate", () => now.textContent = fmtT(v.currentTime));
  document.getElementById("calSpeed").onchange = e => v.playbackRate = +e.target.value;
  document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { v.pause(); v.currentTime = Math.max(0, v.currentTime + +b.dataset.step); });
  document.getElementById("calCyc").onchange = e => {
    calCycle = +e.target.value; calIdx = 0;
    const r = (STPL.references || []).find(x => x.study_id === S.id && Math.abs(x.cycle_start - cyc().start) <= 3);
    calMarks = r ? {...r.marks} : {}; renderTemplateTab();
  };
  const mark = () => {
    const e = STPL.elements[calIdx]; if (!e) return;
    const t = Math.round(v.currentTime * 100) / 100;
    const prev = STPL.elements.slice(0, calIdx).map(x => calMarks[x.id]).filter(x => x != null).pop();
    if (prev != null && t < prev) { toast("This mark is earlier than the previous element's mark."); return; }
    calMarks[e.id] = t; calIdx = Math.min(STPL.elements.length, calIdx + 1);
    const keep = v.currentTime; renderTemplateTab();
    const nv = document.getElementById("calVid"); if (nv) nv.addEventListener("loadedmetadata", () => nv.currentTime = keep, {once: true});
  };
  document.getElementById("calMark").onclick = mark;
  document.querySelectorAll("[data-ci]").forEach(r => r.onclick = ev => {
    if (ev.target.closest("[data-cclr]")) return;
    calIdx = +r.dataset.ci; const e = STPL.elements[calIdx];
    const keep = calMarks[e.id] ?? v.currentTime; renderTemplateTab();
    const nv = document.getElementById("calVid"); if (nv) nv.addEventListener("loadedmetadata", () => nv.currentTime = keep, {once: true});
  });
  document.querySelectorAll("[data-cclr]").forEach(b => b.onclick = () => { delete calMarks[b.dataset.cclr]; renderTemplateTab(); });
  document.getElementById("calCancel").onclick = () => { calMode = false; renderTemplateTab(); };
  document.getElementById("calSave").onclick = async () => {
    if (!Object.keys(calMarks).length) { toast("Mark at least one break point."); return; }
    try {
      const j = await (await api(`/api/stations/${stationKey()}/reference`, jsonBody("POST", {study_id: S.id, cycle_start: cyc().start, marks: calMarks}))).json();
      STPL = j.template; STPL_ISSUES = j.issues; STPL_GRID = j.grid; calMode = false; chartVer = Date.now();
      toast("Reference cycle saved. Mark another, or re-analyze to use them."); renderTemplateTab();
    } catch (e) { toast(`Not saved: ${e.message}`); }
  };
}
document.addEventListener("keydown", e => {
  if (!calMode || curTab !== "template" || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const v = document.getElementById("calVid"); if (!v) return;
  if (e.key === "m" || e.key === "M") { e.preventDefault(); document.getElementById("calMark")?.click(); }

  const c = cycleOf(ci), els = tplEls(), old = S.steps.filter(s => s.cycle === ci), out = [];

    const end = j < els.length ? times[j] : c.end;

      location_id: e.location_id || "", walk: !!e.walk, confidence: "high", edited: false};

  firsts.slice().sort((a, b) => a.y - b.y || a.x - b.x).forEach(f => {
    const nUse = T.elements.filter(e => e.location_id === f.l.id).length;
    const w = (TXT(f.l).length + (nUse ? 4 : 0)) * 0.058 + 0.04, h = 0.13 * f.n;
    const hy = f.l.type === "bin" ? 0.2 : 0.16, hx = f.l.type === "bin" ? 0.2 : 0.26;
    const cands = [
      {dx: 0, dy: hy + 0.13, anchor: "middle", box: [f.x - w / 2, f.y + hy + 0.03, f.x + w / 2, f.y + hy + 0.03 + h]},
      {dx: 0, dy: -hy - 0.05 - (f.n - 1) * 0.13, anchor: "middle", box: [f.x - w / 2, f.y - hy - 0.03 - h, f.x + w / 2, f.y - hy - 0.03]},
      {dx: hx + 0.05, dy: 0.04, anchor: "start", box: [f.x + hx + 0.03, f.y - 0.07, f.x + hx + 0.03 + w, f.y - 0.07 + h]},
      {dx: -hx - 0.05, dy: 0.04, anchor: "end", box: [f.x - hx - 0.03 - w, f.y - 0.07, f.x - hx - 0.03, f.y - 0.07 + h]},
    ];
    const own = [f.l.type === "bin" ? f.x - 0.2 : f.x - 0.26, f.y - hy, f.x + hx, f.y + hy];
    const pick = cands.find(c => !boxes.some(b => b !== own && hit(c.box, b) && !(b[0] === own[0] && b[1] === own[1]))) || cands[0];
    boxes.push(pick.box);
    lpos[f.l.id] = pick;
  });
  const bands = STPL_GRID?.bands || [];
  const byPos = {};
  T.layout.forEach(l => { const [x, y] = gridPos(l); const k = `${x.toFixed(2)},${y.toFixed(2)}`; (byPos[k] = byPos[k] || []).push(l); });
  ed.innerHTML = `<svg viewBox="${vb.join(" ")}" style="width:100%;height:auto;display:block" id="edSvg">
    ${bands.map((b, i) => `<rect x="${b.x0}" y="-0.5" width="${b.x1 - b.x0}" height="3" fill="${i % 2 ? "#f1f5fb" : "#ffffff"}"/><text x="${(b.x0 + b.x1) / 2}" y="-0.55" font-size="0.12" text-anchor="middle" fill="#5f6368">${LOC_COLS.find(c => c[0] === b.column)[1]}</text>`).join("")}
    ${[0, 1, 2].map(r => `<line x1="-0.9" x2="${width + 0.3}" y1="${r + 0.5}" y2="${r + 0.5}" stroke="#dbe3ee" stroke-width="0.01" stroke-dasharray="0.04 0.04"/><text x="-0.9" y="${r + 0.04}" font-size="0.11" font-weight="600" fill="#5f6368">${["Back", "Middle", "Front"][r]}</text>`).join("")}
    <circle cx="${width / 2}" cy="2.95" r="0.13" fill="#e8eef8" stroke="#1f1f1f" stroke-width="0.015"/><text x="${width / 2}" y="3.18" font-size="0.1" text-anchor="middle">You</text>
    ${Object.values(byPos).map(group => group.map((l, gi) => {
      const [x, y] = gridPos(l), sel = tplSel === l.id, col = sel ? "#0b57d0" : "#3c4043";
      const shape = gi > 0 ? "" : (l.type === "bin" ? `<circle r="0.2" fill="#c9ced6" stroke="${col}" stroke-width="${sel ? 0.03 : 0.015}"/>` :
        `<rect x="-0.26" y="-0.16" width="0.52" height="0.32" fill="#fff" stroke="${col}" stroke-width="${sel ? 0.03 : 0.015}" ${l.type === "output" ? 'stroke-dasharray="0.05 0.03"' : ""}/>${l.type === "equipment" ? `<path d="M-0.26 -0.16 L0.26 0.16 M-0.26 0.16 L0.26 -0.16" stroke="${col}" stroke-width="0.012"/>` : ""}`);
      const nUse = T.elements.filter(e => e.location_id === l.id).length;
      return `<g data-loc="${esc(l.id)}" transform="translate(${x} ${y})" style="cursor:grab">${shape}
        <text x="${lpos[group[0].id].dx}" y="${lpos[group[0].id].dy + gi * 0.13}" font-size="0.11" text-anchor="${lpos[group[0].id].anchor}" fill="${col}"><title>${esc(l.label)}</title>${esc(TXT(l))}${nUse ? ` (${nUse})` : ""}</text></g>`;
    }).join("")).join("")}
  </svg>`;
  const svg = document.getElementById("edSvg");
  const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  let drag = null;
  svg.querySelectorAll("[data-loc]").forEach(g => {
    g.onpointerdown = e => { e.preventDefault(); const id = g.dataset.loc; tplSel = id; const l = T.layout.find(x => x.id === id); const p = pt(e); const [x, y] = gridPos(l); drag = {l, dx: x - p.x, dy: y - p.y, moved: false}; svg.setPointerCapture(e.pointerId); };
  });
  svg.onpointermove = e => {
    if (!drag) return; const p = pt(e);
    const x = Math.max(0, Math.min(width, p.x + drag.dx)), y = Math.max(0, Math.min(2, p.y + drag.dy));
    drag.moved = true; drag.x = x; drag.y = y;
    const g = svg.querySelector(`[data-loc="${CSS.escape(drag.l.id)}"]`); if (g) g.setAttribute("transform", `translate(${x} ${y})`);
  };
  svg.onpointerup = () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) {
      T.layout.forEach(l => { const [x, y] = gridPos(l); l.x = +x.toFixed(3); l.y = +y.toFixed(3); });  // fix everyone's position
      let x = Math.round(d.x * 20) / 20, y = Math.round(d.y * 20) / 20;
      const near = T.layout.find(o => o !== d.l && Math.hypot(o.x - x, o.y - y) < 0.25);
      if (near) { x = near.x; y = near.y; }  // dropped on another place: stack (bins on shelves)
      d.l.x = x; d.l.y = y;
      recomputeCategories();
      tplDirty = true; document.getElementById("tplSave").disabled = false;
    }
    drawLayoutEditor();
  };
  drawLocPanel();
}
function recomputeCategories() {
  const T = STPL;
  T.layout.forEach(l => { l.row = ["back", "middle", "front"][Math.max(0, Math.min(2, Math.round(l.y)))]; l.column = bandOf(l.x); });
  const cells = {};
  T.layout.forEach(l => (cells[`${l.column}|${l.row}`] = cells[`${l.column}|${l.row}`] || []).push(l));
  Object.values(cells).forEach(list => {
    const xs = [...new Set(list.map(l => l.x.toFixed(2)))].sort((a, b) => a - b);
    list.forEach(l => l.order = xs.indexOf(l.x.toFixed(2)) + 1);
  });
}

async function saveTemplate() {

async function importSheet(file) {
  if (!file) return;

  try {
    const r = await (await api(`/api/stations/${stationKey()}/import-sheet`, {method: "POST", body: fd})).json();
    if (!r.elements.length) { toast("No steps found on the sheet."); return; }
    if (STPL && STPL.elements.length && !confirm(`Replace the ${STPL.elements.length} template steps with ${r.elements.length} steps read from your sheet?`)) return;
